<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ariadna — demo de guía paso a paso</title>

    <link rel="stylesheet" href="css/componente.css">
    <link rel="stylesheet" href="css/index.css">

</head>

<body>
    <header id="encabezado">
        <h1>Ariadna</h1>
        <p>Guías paso a paso para cualquier página</p>
        <button type="button" id="btnGuiaPagina" class="boton boton--claro">Recorrer la página</button>
    </header>

    <main>
        <form id="formRegistro" class="caja">
        <h2 id="tituloForm">Registro de usuario</h2>
        <p class="ayuda">¿No sabes cómo llenarlo?</p>
        <button type="button" id="btnGuiaForm" class="boton boton--verde">Guíame por el formulario</button>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="José Pérez">

        <label for="correo">Correo</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com">

        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" placeholder="9511234567">

        <label for="password">Contraseña</label>
        <input type="password" id="password">

        <button type="submit" id="btnRegistrar" class="boton boton--verde">Registrarme</button>
        <p id="mensaje"></p>
        </form>
    </main>

    <footer id="pie">
        Ariadna
    </footer>

      <script src="js/componente.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
